name: Deploy Autocaption (CDK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  STYLES_BUCKET: autocaption-styles-deadzone-423623826655

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest starlette pydantic boto3
          PYTHONPATH=. pytest tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve stack outputs (if already deployed)
        id: stack
        continue-on-error: true
        run: |
          API=$(aws cloudformation describe-stacks --stack-name AutocaptionStack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" --output text 2>/dev/null || true)
          echo "api_url=${API:-}" >> "$GITHUB_OUTPUT"

      - name: Frontend static export
        run: |
          npm ci
          export NEXT_PUBLIC_API_URL="${{ steps.stack.outputs.api_url }}"
          if [ -z "$NEXT_PUBLIC_API_URL" ] || [ "$NEXT_PUBLIC_API_URL" = "None" ]; then
            export NEXT_PUBLIC_API_URL="http://localhost:8000"
          fi
          unset NEXT_PUBLIC_WARMUP_URL
          echo "Building UI with API=$NEXT_PUBLIC_API_URL (same-origin warmup)"
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: CDK deploy
        working-directory: infra/cdk
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          npm ci
          npx cdk bootstrap "aws://${CDK_DEFAULT_ACCOUNT}/${CDK_DEFAULT_REGION}" || true
          npx cdk deploy AutocaptionStack --require-approval never \
            -c "stylesBucketName=${{ env.STYLES_BUCKET }}"

      - name: Re-bake UI with live API URLs
        run: |
          API=$(aws cloudformation describe-stacks --stack-name AutocaptionStack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" --output text)
          echo "Rebuilding UI with API=$API (same-origin warmup)"
          NEXT_PUBLIC_API_URL="$API" npm run build
          cd infra/cdk
          npx cdk deploy AutocaptionStack --require-approval never \
            -c "stylesBucketName=${{ env.STYLES_BUCKET }}"

      - name: Print outputs
        run: |
          aws cloudformation describe-stacks --stack-name AutocaptionStack \
            --query "Stacks[0].Outputs" --output table
